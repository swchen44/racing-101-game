<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAIPEI 101 — 午夜疾走 MIDNIGHT CIRCUIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&family=Noto+Sans+TC:wght@300;500;700;900&family=Zen+Dots&display=swap" rel="stylesheet">
<style>
:root {
  --neon-jade: #3ee6a8;
  --neon-amber: #ffb54d;
  --neon-red: #ff4d6d;
  --neon-cyan: #4dd8ff;
  --ink: #060a12;
  --glass: rgba(10, 16, 28, 0.72);
  --hud-font: 'Chakra Petch', 'Noto Sans TC', sans-serif;
  --display-font: 'Zen Dots', 'Noto Sans TC', sans-serif;
  --tc-font: 'Noto Sans TC', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); font-family: var(--hud-font); }
canvas#game { display: block; width: 100%; height: 100%; }

#ui { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; }

/* ---------- cinematic frame ---------- */
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(2,4,10,0.55) 100%); }
#grain { position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: overlay; }

/* ---------- HUD bottom-left: speed (一體式模組:讀數疊在儀表圓心) ---------- */
#speed-pod {
  position: absolute; left: 34px; bottom: 30px;
  width: 190px; height: 190px;
  filter: drop-shadow(0 0 18px rgba(62,230,168,0.25));
  opacity: 0; transition: opacity .6s ease;
}
#speed-gauge { position: absolute; inset: 0; width: 190px; height: 190px; }
#speed-readout {
  position: absolute; inset: 0; padding-top: 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#speed-num {
  /* Chakra Petch:乾淨的 tabular 零,避免 Zen Dots 斜線零被誤讀為「∅」 */
  font-family: var(--hud-font); font-weight: 700; font-size: 44px; line-height: 1;
  color: #eafff5; text-shadow: 0 0 20px rgba(62,230,168,0.8);
  font-variant-numeric: tabular-nums; letter-spacing: 1px; text-align: center;
}
#speed-unit { font-size: 11px; letter-spacing: 5px; text-indent: 5px; color: var(--neon-jade); margin-top: 3px; font-weight: 600; }
#drift-tag {
  position: absolute; top: -26px; left: 50%;
  font-family: var(--tc-font); font-weight: 900; font-size: 15px; letter-spacing: 4px;
  white-space: nowrap;
  color: var(--neon-amber); text-shadow: 0 0 14px rgba(255,181,77,0.9);
  opacity: 0; transform: translateX(-50%) skewX(-8deg); transition: opacity .12s;
}
#drift-tag.on { opacity: 1; animation: driftPulse .5s infinite alternate; }
@keyframes driftPulse { from { text-shadow: 0 0 10px rgba(255,181,77,.7);} to { text-shadow: 0 0 26px rgba(255,120,60,1);} }

/* ---------- HUD top-left: lap + times ---------- */
#race-pod {
  position: absolute; left: 34px; top: 30px;
  background: var(--glass); border: 1px solid rgba(77,216,255,0.18);
  border-left: 3px solid var(--neon-jade);
  padding: 12px 20px 12px 16px; min-width: 200px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
  backdrop-filter: blur(8px);
  opacity: 0; transition: opacity .6s ease;
}
/* 主行:TIME (視覺主角) + LAP 同行靠右 */
#main-row { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
#lap-line { display: flex; align-items: baseline; gap: 6px; }
#lap-label { font-family: var(--tc-font); font-size: 10px; letter-spacing: 3px; color: #7fa8c9; font-weight: 500; }
#lap-num { font-family: var(--display-font); font-size: 22px; color: #fff; text-shadow: 0 0 14px rgba(77,216,255,0.6); }
#lap-total { font-size: 13px; color: #6d90b2; }
.time-row { display: flex; justify-content: space-between; gap: 14px; margin-top: 5px; font-size: 14px; font-variant-numeric: tabular-nums; }
.time-row .k { color: #6d8fae; letter-spacing: 3px; font-size: 11px; font-weight: 600; align-self: center; }
.time-row .v { color: #dff3ff; letter-spacing: 1px; font-weight: 600; }
#t-current { margin-top: 0; justify-content: flex-start; gap: 10px; }
#t-current .v { color: #fff; font-size: 24px; font-weight: 700; text-shadow: 0 0 12px rgba(77,216,255,0.55); }
#t-best .v { color: var(--neon-amber); }
.time-row .v.empty { color: #3a5570; text-shadow: none; } /* 尚無紀錄的靜默空狀態 */

/* ---------- minimap ---------- */
#minimap-wrap {
  position: absolute; right: 30px; top: 30px; width: 172px; height: 172px;
  background: var(--glass); border: 2px solid rgba(62,230,168,0.35);
  border-radius: 50%; backdrop-filter: blur(6px);
  box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 0 20px rgba(62,230,168,0.28), inset 0 0 24px rgba(62,230,168,0.06);
  opacity: 0; transition: opacity .6s ease;
}
#minimap { width: 100%; height: 100%; }

/* ---------- wrong way ---------- */
#wrongway {
  position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
  font-family: var(--tc-font); font-weight: 900; font-size: 34px; letter-spacing: 12px;
  color: var(--neon-red); text-shadow: 0 0 24px rgba(255,77,109,0.9);
  opacity: 0; transition: opacity .2s;
}
#wrongway.on { opacity: 1; animation: wwBlink .5s steps(2) infinite; }
@keyframes wwBlink { 50% { opacity: .25; } }

/* ---------- center message ---------- */
#center-msg {
  position: absolute; top: 34%; left: 50%; transform: translate(-50%,-50%);
  font-family: var(--display-font); font-size: 120px; color: #fff;
  text-shadow: 0 0 40px rgba(62,230,168,0.9), 0 0 90px rgba(62,230,168,0.5);
  opacity: 0; letter-spacing: 8px; text-align: center;
}
#center-msg.pop { animation: msgPop .9s cubic-bezier(.2,1.6,.3,1) forwards; }
@keyframes msgPop {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(2.4); filter: blur(12px); }
  25% { opacity: 1; transform: translate(-50%,-50%) scale(1); filter: blur(0); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(.9); }
}
#sub-msg {
  position: absolute; top: 46%; left: 50%; transform: translateX(-50%);
  font-family: var(--tc-font); font-size: 20px; letter-spacing: 10px; font-weight: 500;
  color: var(--neon-amber); text-shadow: 0 0 16px rgba(255,181,77,0.8);
  opacity: 0;
}
#sub-msg.pop { animation: subPop 1.2s ease forwards; }
@keyframes subPop { 0%{opacity:0; letter-spacing:24px;} 30%{opacity:1; letter-spacing:10px;} 85%{opacity:1;} 100%{opacity:0;} }

/* ---------- title screen ---------- */
/* 標題整組靠左:把畫面右 2/3 讓給環繞運鏡中的台北 101,地標完整亮相不被 wordmark 遮擋 */
#title-screen {
  position: absolute; inset: 0; pointer-events: auto;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start;
  padding-top: 13vh; padding-left: 7vw;
  background:
    radial-gradient(ellipse 90% 60% at 50% 110%, rgba(255,140,60,0.13), transparent 60%),
    radial-gradient(ellipse 80% 70% at 22% 30%, rgba(4,7,14,0.55), transparent 70%),
    linear-gradient(105deg, rgba(4,7,14,0.78) 0%, rgba(4,7,14,0.55) 40%, rgba(4,7,14,0.18) 70%, rgba(4,7,14,0.1) 100%);
  transition: opacity 1s ease; z-index: 10;
}
#title-screen.hidden { opacity: 0; pointer-events: none; }
/* 標題畫面期間徹底隱藏 HUD/訊息層,避免鬼影透出 (visibility 而非 opacity) */
#ui:has(#title-screen:not(.hidden)) :is(#race-pod, #speed-pod, #minimap-wrap, #wrongway, #center-msg, #sub-msg, #record-flash) { visibility: hidden; }
#title-tower { font-family: var(--tc-font); font-weight: 300; font-size: 15px; letter-spacing: 18px; color: #8fb4d4; margin-bottom: 14px; }
#title-main {
  font-family: var(--display-font); font-size: clamp(40px, 6.6vw, 84px); line-height: 1.02;
  background: linear-gradient(175deg, #ffffff 20%, #9be8cd 45%, var(--neon-jade) 70%, #1e8f68 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 30px rgba(62,230,168,0.45));
  text-align: left; letter-spacing: 4px;
}
#title-zh {
  font-family: var(--tc-font); font-weight: 900; font-size: clamp(28px, 4vw, 46px);
  letter-spacing: 24px; margin-top: 18px;
  color: #fff; text-shadow: 0 0 24px rgba(255,181,77,0.85), 0 0 60px rgba(255,120,60,0.4);
}
#title-rule { width: 340px; height: 1px; margin: 32px 0 26px;
  background: linear-gradient(90deg, rgba(62,230,168,0.7), transparent); }
#press-start {
  font-family: var(--hud-font); font-size: 16px; letter-spacing: 8px; color: #cfe9ff;
  animation: startBlink 1.6s ease-in-out infinite; cursor: pointer;
  border: 1px solid rgba(77,216,255,0.35); padding: 14px 44px;
  /* 不透明底:CTA 後方不透出任何場景/文字 */
  background: linear-gradient(rgba(77,216,255,0.08), rgba(77,216,255,0.08)) rgba(8,14,26,0.88);
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
}
#press-start:hover { background: linear-gradient(rgba(77,216,255,0.2), rgba(77,216,255,0.2)) rgba(8,14,26,0.92); color: #fff; }
@keyframes startBlink { 50% { opacity: .45; } }
#controls-hint { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 14px 26px; font-size: 12px; color: #8fb4d4; letter-spacing: 2px; }
#controls-hint b {
  color: #dcefff; font-weight: 600;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 4px; padding: 3px 8px; margin-right: 2px;
}
#loading-tag { position: absolute; bottom: 14px; left: 7vw; font-size: 10px; letter-spacing: 4px; color: #44607d; opacity: 0.6; }

/* ---------- results ---------- */
#results {
  position: absolute; inset: 0; display: none; pointer-events: auto;
  flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, rgba(4,8,16,0.55), rgba(4,8,16,0.9));
  z-index: 9;
}
#results.on { display: flex; animation: resFade .8s ease; }
@keyframes resFade { from { opacity: 0; } }
#res-title { font-family: var(--display-font); font-size: 64px; color: #fff; text-shadow: 0 0 34px rgba(255,181,77,0.8); letter-spacing: 6px; }
#res-zh { font-family: var(--tc-font); font-weight: 900; font-size: 22px; letter-spacing: 14px; color: var(--neon-amber); margin-top: 10px; text-indent: 14px; }
#res-table { margin-top: 36px; min-width: 320px; }
.res-row { display: flex; justify-content: space-between; padding: 9px 6px; font-size: 16px;
  border-bottom: 1px solid rgba(127,168,201,0.14); font-variant-numeric: tabular-nums; }
.res-row .k { color: #7fa8c9; letter-spacing: 4px; font-size: 12px; align-self: center; font-family: var(--tc-font); }
.res-row .v { color: #eaf6ff; letter-spacing: 1px; font-weight: 600; }
.res-row.hl .v { color: var(--neon-jade); text-shadow: 0 0 12px rgba(62,230,168,0.6); font-size: 19px; }
#res-restart { margin-top: 44px; font-size: 14px; letter-spacing: 6px; color: #cfe9ff; cursor: pointer;
  border: 1px solid rgba(62,230,168,0.4); padding: 13px 40px; background: rgba(62,230,168,0.07);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  animation: startBlink 1.8s ease-in-out infinite; }
#res-restart:hover { background: rgba(62,230,168,0.18); color: #fff; }

/* ---------- new record flash ---------- */
#record-flash {
  position: absolute; top: 55%; left: 50%; transform: translateX(-50%);
  font-family: var(--tc-font); font-weight: 900; font-size: 26px; letter-spacing: 8px;
  color: var(--neon-cyan); text-shadow: 0 0 20px rgba(77,216,255,0.9); opacity: 0;
}
#record-flash.pop { animation: subPop 1.6s ease forwards; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="vignette"></div>
  <svg id="grain" width="100%" height="100%"><filter id="noiseF"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#noiseF)"/></svg>

  <div id="race-pod">
    <div id="main-row">
      <div class="time-row" id="t-current"><span class="k">TIME</span><span class="v">0:00.000</span></div>
      <div id="lap-line">
        <span id="lap-label">LAP</span>
        <span id="lap-num">1</span><span id="lap-total">/ 3</span>
      </div>
    </div>
    <div class="time-row" id="t-last"><span class="k">LAST</span><span class="v empty">—</span></div>
    <div class="time-row" id="t-best"><span class="k">BEST</span><span class="v empty">—</span></div>
  </div>

  <div id="minimap-wrap"><canvas id="minimap" width="344" height="344"></canvas></div>

  <div id="speed-pod">
    <canvas id="speed-gauge" width="380" height="380"></canvas>
    <div id="speed-readout">
      <span id="speed-num">0</span>
      <span id="speed-unit">KM/H</span>
    </div>
    <span id="drift-tag">滑走 DRIFT</span>
  </div>

  <div id="wrongway">⚠ 逆走 WRONG WAY ⚠</div>
  <div id="center-msg"></div>
  <div id="sub-msg"></div>
  <div id="record-flash">★ 最速紀錄 NEW RECORD ★</div>

  <div id="results">
    <div id="res-title">FINISH</div>
    <div id="res-zh">完 走 認 定</div>
    <div id="res-table"></div>
    <div id="res-restart">再挑戰 RESTART — R</div>
  </div>

  <div id="title-screen">
    <div id="title-tower">TAIPEI 101 · XINYI DISTRICT</div>
    <div id="title-main">MIDNIGHT<br>CIRCUIT</div>
    <div id="title-zh">午 夜 疾 走</div>
    <div id="title-rule"></div>
    <div id="press-start">按下 ENTER 出走 / PRESS START</div>
    <div id="controls-hint">
      <span><b>W A S D / ↑←↓→</b>&nbsp; 駕駛</span>
      <span><b>SPACE</b>&nbsp; 手煞車滑走</span>
      <span><b>C</b>&nbsp; 視角</span>
      <span><b>R</b>&nbsp; 重新開始</span>
    </div>
    <div id="loading-tag">LOADING XINYI GRID…</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
